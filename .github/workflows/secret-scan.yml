name: Secret scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan all reachable Git history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.25.x"
      - name: Install pinned Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: Scan every reachable commit and ref
        run: |
          "$(go env GOPATH)/bin/gitleaks" git \
            --log-opts="--all" \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            .
