name: Deployment Dash — Kubescape review

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "**/Chart.yaml"
      - "**/kustomization.yaml"
      - "**/kustomization.yml"
      - ".github/workflows/kubescape-review.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "**/Chart.yaml"
      - "**/kustomization.yaml"
      - "**/kustomization.yml"
      - ".github/workflows/kubescape-review.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: kubescape-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubescape:
    name: Scan Kubernetes configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Kubernetes manifests
        id: manifests
        shell: bash
        run: |
          set -euo pipefail
          if grep -rlE '^[[:space:]]*apiVersion:[[:space:]]*[^[:space:]]+' . \
            --include='*.yaml' --include='*.yml' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
            --exclude-dir=venv --exclude-dir=.venv > /tmp/k8s-manifests.txt; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Kubernetes manifest candidates:"
            cat /tmp/k8s-manifests.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Kubernetes YAML manifests found. Kubescape scan is skipped."
          fi

      - name: Scan manifests with Kubescape
        id: scan
        if: steps.manifests.outputs.found == 'true'
        uses: kubescape/github-action@0e5b202e9e3d32623bb0449eb90220b06f583f49 # main snapshot; review before updating
        continue-on-error: true
        with:
          format: sarif
          outputFile: kubescape-results
          frameworks: nsa,mitre

      # Preserve the original SARIF before Code Scanning processes it.
      - name: Keep SARIF report as a downloadable artifact
        if: always() && steps.manifests.outputs.found == 'true' && hashFiles('kubescape-results.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubescape-sarif-report
          path: kubescape-results.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload findings to GitHub Code Scanning
        if: always() && steps.manifests.outputs.found == 'true' && hashFiles('kubescape-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: kubescape-results.sarif
          category: kubescape-manifest-scan

      - name: Explain scan result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.manifests.outputs.found }}" != "true" ]]; then
            echo "::notice::No Kubernetes manifests were found; there is nothing for Kubescape to scan."
          elif [[ -s kubescape-results.sarif ]]; then
            if [[ "${{ steps.scan.outcome }}" == "failure" ]]; then
              echo "::notice::Kubescape generated a SARIF report, but its severity threshold returned a non-zero exit code. The report was preserved and submitted."
            else
              echo "::notice::Kubescape generated a SARIF report successfully."
            fi
          else
            echo "::warning::Kubescape did not produce a SARIF report. Check the scan step logs."
          fi
