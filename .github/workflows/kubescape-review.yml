name: Deployment Dash — Kubescape review

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/Chart.yaml"
      - "**/kustomization.yaml"
      - "**/kustomization.yml"
      - ".github/workflows/kubescape-review.yml"
  push:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/Chart.yaml"
      - "**/kustomization.yaml"
      - "**/kustomization.yml"
      - ".github/workflows/kubescape-review.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: kubescape-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubescape:
    name: Scan Kubernetes configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan manifests with Kubescape
        id: scan
        uses: kubescape/github-action@main
        continue-on-error: true
        with:
          format: sarif
          outputFile: kubescape-results
          frameworks: |
            nsa
            mitre

      - name: Upload findings to GitHub Code Scanning
        if: always() && hashFiles('kubescape-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: kubescape-results.sarif
          category: kubescape-manifest-scan

      - name: Keep SARIF report as a downloadable artifact
        if: always() && hashFiles('kubescape-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kubescape-sarif-report
          path: kubescape-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Explain missing SARIF output
        if: always() && hashFiles('kubescape-results.sarif') == ''
        run: |
          echo "::warning::Kubescape did not produce a SARIF report. Check the scan step logs and manifest paths."
