name: Deployment Dash — Kubescape review

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "**/Chart.yaml"
      - "**/kustomization.yaml"
      - "**/kustomization.yml"
      - ".github/workflows/kubescape-review.yml"
  push:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "**/Chart.yaml"
      - "**/kustomization.yaml"
      - "**/kustomization.yml"
      - ".github/workflows/kubescape-review.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: kubescape-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubescape:
    name: Scan Kubernetes configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Kubernetes manifests
        id: manifests
        shell: bash
        run: |
          set -euo pipefail
          if grep -rlE '^[[:space:]]*apiVersion:[[:space:]]*[^[:space:]]+' . \
            --include='*.yaml' --include='*.yml' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
            --exclude-dir=venv --exclude-dir=.venv > /tmp/k8s-manifests.txt; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Kubernetes manifest candidates:"
            cat /tmp/k8s-manifests.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Kubernetes YAML manifests found. Kubescape scan is skipped."
          fi

      - name: Scan manifests with Kubescape
        id: scan
        if: steps.manifests.outputs.found == 'true'
        uses: kubescape/github-action@main
        continue-on-error: true
        with:
          format: sarif
          outputFile: kubescape-results
          frameworks: nsa,mitre

      - name: Upload findings to GitHub Code Scanning
        if: always() && steps.manifests.outputs.found == 'true' && hashFiles('kubescape-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: kubescape-results.sarif
          category: kubescape-manifest-scan

      - name: Keep SARIF report as a downloadable artifact
        if: steps.manifests.outputs.found == 'true' && steps.scan.outcome == 'success' && hashFiles('kubescape-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kubescape-sarif-report
          path: kubescape-results.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Explain missing or failed scan
        if: always() && (steps.manifests.outputs.found != 'true' || steps.scan.outcome == 'failure')
        shell: bash
        run: |
          if [[ "${{ steps.manifests.outputs.found }}" != "true" ]]; then
            echo "::notice::No Kubernetes manifests were found; there is nothing for Kubescape to scan."
          else
            echo "::warning::Kubescape did not complete successfully. Check the scan step logs."
          fi
