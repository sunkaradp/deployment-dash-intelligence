name: Generate reproducible dependency locks

on:
  pull_request:
    paths:
      - "frontend/package.json"
      - "pyproject.toml"
      - ".github/workflows/lockfile-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Generate and validate npm lockfile
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Generate hash-locked Python dependency files
        run: |
          python -m pip install --disable-pip-version-check "pip-tools==7.4.1"
          pip-compile --generate-hashes --resolver=backtracking pyproject.toml --output-file requirements-prod.lock
          pip-compile --generate-hashes --resolver=backtracking --extra dev pyproject.toml --output-file requirements-dev.lock

      - name: Validate Python lockfile installation and tests
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          ruff check .
          pytest

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproducible-lockfiles
          path: |
            frontend/package-lock.json
            requirements-prod.lock
            requirements-dev.lock
          if-no-files-found: error
          retention-days: 7
