name: Deploy Dash GitHub Action smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/deploydash/**"
      - ".github/workflows/action-smoke.yml"
      - "frontend/**"
      - "tests/fixtures/**"
  pull_request:
    paths:
      - ".github/actions/deploydash/**"
      - ".github/workflows/action-smoke.yml"
      - "frontend/**"
      - "tests/fixtures/**"

permissions:
  contents: read

jobs:
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run local Deploy Dash action against a known-risk fixture
        id: scan
        uses: ./.github/actions/deploydash
        with:
          path: tests/fixtures/action-risky.yaml
          fail-on-findings: "false"
          output: json
