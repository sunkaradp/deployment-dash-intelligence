name: Deploy Dash GitHub Action smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/deploydash/**"
      - ".github/workflows/action-smoke.yml"
      - "frontend/**"
      - "tests/fixtures/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/actions/deploydash/**"
      - ".github/workflows/action-smoke.yml"
      - "frontend/**"
      - "tests/fixtures/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run local Deploy Dash action against a known-risk fixture
        id: scan
        uses: ./.github/actions/deploydash
        with:
          path: tests/fixtures/action-risky.yaml
          fail-on-findings: "false"
          output: json
