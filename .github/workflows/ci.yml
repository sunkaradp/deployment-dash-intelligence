name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Set up Node.js for cross-engine parity tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Python dependencies from committed hashes
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit --skip-editable
      - name: Lint
        run: ruff check .
      - name: Test Python API
        run: python -m pytest
      - name: Install frontend dependencies from committed lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build TypeScript analyzer for cross-engine parity tests
        working-directory: frontend
        run: npm run build:cli
      - name: Test shared TypeScript analyzer and CLI
        working-directory: frontend
        run: npm test
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
